<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計思考ラボ — UI/UX学習アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-2:#F8F8F8;
    --line:#E4E4E4;
    --line-soft:#F1F1F1;
    --ink:#111111;
    --ink-soft:#6B6B6B;
    --ink-faint:#9C9C9C;
    --accent:#111111;
    --accent-soft:#F8F8F8;
    --serif:'Fraunces', serif;
    --sans:'IBM Plex Sans JP','IBM Plex Sans',sans-serif;
    --mono:'IBM Plex Mono', monospace;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--line-soft) 0, var(--line-soft) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--line-soft) 0, var(--line-soft) 1px, transparent 1px, transparent 28px);
    background-position:center top;
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;}
  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    padding:0 20px;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  .corner{
    position:absolute;
    width:14px;height:14px;
    pointer-events:none;
  }
  .corner::before,.corner::after{content:"";position:absolute;background:var(--ink-faint);}
  .corner::before{width:100%;height:1px;top:50%;}
  .corner::after{height:100%;width:1px;left:50%;}
  .corner-tl{top:10px;left:2px;}
  .corner-tr{top:10px;right:2px;}
  .corner-bl{bottom:10px;left:2px;}
  .corner-br{bottom:10px;right:2px;}

  .app-header{position:relative;padding:32px 0 0;}
  .brand{display:flex;align-items:baseline;gap:10px;padding:0 4px;}
  .brand-mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:2px 6px;
    border-radius:var(--radius);
  }
  .app-header h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .tagline{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:8px 4px 22px;
    max-width:46ch;
  }
  .tabs{
    display:flex;
    gap:22px;
    padding:0 4px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    background:none;border:none;
    padding:10px 0 12px;
    font-size:14.5px;
    color:var(--ink-faint);
    cursor:pointer;
    position:relative;
    font-weight:500;
    transition:color .15s ease;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);}
  .tab.active::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-1px;
    height:2px;background:var(--accent);
  }
  .tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  main{padding:26px 4px 60px; min-height:50vh;}

  .app-footer{position:relative; height:40px;}

  /* --- shared bits --- */
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .panel-title{
    font-family:var(--serif);
    font-size:20px;
    font-weight:600;
    margin:0 0 10px;
    line-height:1.4;
  }
  .lede{color:var(--ink-soft); font-size:14.5px; margin:0 0 20px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:12px 20px;
    font-size:14.5px;
    font-weight:500;
    border-radius:var(--radius);
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:#000;}
  .btn:active{transform:scale(.98);}
  .btn.secondary{
    background:none; color:var(--ink); border:1px solid var(--ink);
  }
  .btn.secondary:hover{background:var(--ink); color:var(--paper);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* --- quiz --- */
  .quiz-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:12px; color:var(--ink-faint);
    margin-bottom:14px;
  }
  .quiz-progress{display:flex; gap:4px;}
  .quiz-progress span{width:14px; height:3px; background:var(--line); display:block;}
  .quiz-progress span.done{background:var(--ink);}
  .quiz-progress span.now{background:#fff; border:1px solid var(--ink);}
  .quiz-card{
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .quiz-q{font-family:var(--serif); font-size:19px; font-weight:600; margin:0 0 20px; line-height:1.5;}
  .choice{
    display:flex; align-items:flex-start; gap:12px;
    width:100%; text-align:left;
    background:none; border:1px solid var(--line);
    padding:13px 14px; margin-bottom:9px;
    border-radius:var(--radius);
    font-size:14.5px; color:var(--ink);
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice:hover:not(:disabled){border-color:var(--ink);}
  .choice .mark{
    font-family:var(--mono); font-size:12px; color:var(--ink-faint);
    border:1px solid var(--line-soft); border-radius:50%;
    width:20px; height:20px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .choice.correct{border-color:var(--ink); border-width:2px; background:#fff;}
  .choice.correct .mark{border-color:var(--ink); color:var(--ink); background:#fff;}
  .choice.wrong{border-color:var(--ink); background:var(--ink); color:#fff;}
  .choice.wrong .mark{border-color:#fff; color:#fff; background:var(--ink);}
  .choice:disabled{cursor:default;}
  .explain{
    margin-top:16px; padding:14px 16px;
    background:var(--paper-2);
    border-left:3px solid var(--accent);
    font-size:14px; color:var(--ink);
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .explain b{font-family:var(--mono); font-size:11px; letter-spacing:.03em; display:block; margin-bottom:6px; color:var(--accent);}
  .quiz-footer{display:flex; justify-content:flex-end; margin-top:20px;}
  .quiz-done{text-align:center; padding:30px 10px;}
  .quiz-done .score{font-family:var(--serif); font-size:44px; font-weight:600; margin:14px 0;}

  /* --- socratic / practice (chat) --- */
  .topic-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .chip{
    border:1px solid var(--line); background:#fff;
    padding:9px 13px; font-size:13.5px; border-radius:var(--radius);
    cursor:pointer; color:var(--ink); text-align:left;
    transition:border-color .12s ease;
  }
  .chip:hover{border-color:var(--ink);}
  .scenario-card{
    border:1px solid var(--line); background:#fff; border-radius:var(--radius);
    padding:14px 15px; margin-bottom:9px; cursor:pointer;
  }
  .scenario-card:hover{border-color:var(--ink);}
  .scenario-card h3{margin:0 0 4px; font-size:14.5px; font-family:var(--serif); font-weight:600;}
  .scenario-card p{margin:0; font-size:13px; color:var(--ink-soft);}

  .chat-thread{display:flex; flex-direction:column; gap:14px; margin-bottom:16px;}
  .msg{max-width:88%; animation:rise .18s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .msg.mentor{align-self:flex-start;}
  .msg.user{align-self:flex-end;}
  .msg .who{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-bottom:4px; letter-spacing:.03em;}
  .msg.user .who{text-align:right;}
  .msg .bubble{padding:11px 14px; font-size:14.5px; border-radius:var(--radius); line-height:1.65;}
  .msg.mentor .bubble{background:#fff; border:1px solid var(--line);}
  .msg.user .bubble{background:var(--ink); color:var(--paper);}
  .msg.mentor.summary .bubble{background:var(--accent-soft); border:1px solid var(--accent); white-space:pre-line;}
  .msg.mentor .bubble.error{background:#fff; border:1px dashed var(--ink); color:var(--ink);}
  .typing{display:inline-flex; gap:4px; padding:4px 0;}
  .typing span{width:5px; height:5px; border-radius:50%; background:var(--ink-faint); animation:blink 1.1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .composer{display:flex; gap:8px; border-top:1px solid var(--line); padding-top:14px; position:sticky; bottom:0; background:var(--paper);}
  .composer textarea{
    flex:1; resize:none; border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; font-family:inherit; font-size:14.5px; background:#fff; color:var(--ink);
    min-height:44px; max-height:120px;
  }
  .composer .btn{align-self:flex-end;}
  .back-link{
    background:none; border:none; color:var(--ink-faint); font-size:13px;
    cursor:pointer; padding:0 0 16px; display:inline-flex; align-items:center; gap:5px;
  }
  .back-link:hover{color:var(--ink);}

  @media (max-width:480px){
    .app{padding:0 14px;}
    .app-header h1{font-size:22px;}
    .msg{max-width:94%;}
    .tabs{gap:14px; overflow-x:auto; scrollbar-width:none;}
    .tab{white-space:nowrap; font-size:13.5px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* --- basics（思い出す学び方） --- */
  .tab .due{
    display:inline-block; min-width:16px; height:16px; padding:0 4px; margin-left:4px;
    font-family:var(--mono); font-size:10px; line-height:16px; text-align:center;
    background:var(--ink); color:var(--paper); border-radius:8px; vertical-align:1px;
  }
  .block{border:1px solid var(--line); background:#fff; border-radius:var(--radius); padding:18px 18px; margin-bottom:16px;}
  .block h3{font-family:var(--serif); font-size:16px; font-weight:600; margin:0 0 8px;}
  .block p{margin:0 0 10px; font-size:14.5px;}
  .block p:last-child{margin-bottom:0;}
  .block ul,.block ol{margin:6px 0 0; padding-left:20px; font-size:14.5px; line-height:1.85;}
  .block-ink{border-color:var(--ink);}
  .note{font-size:12.5px; color:var(--ink-soft); margin-top:10px !important;}
  .tag{
    display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
    border:1px solid var(--ink); padding:1px 6px; margin-bottom:8px; border-radius:var(--radius);
  }
  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px;}

  .step-bar{list-style:none; display:flex; gap:4px; padding:0; margin:0 0 22px; counter-reset:step;}
  .step-bar li{
    flex:1; counter-increment:step; text-align:center;
    font-size:11px; color:var(--ink-faint); padding-top:8px; border-top:2px solid var(--line);
  }
  .step-bar li::before{content:counter(step) ". "; font-family:var(--mono);}
  .step-bar li.done{color:var(--ink-soft); border-top-color:var(--ink-soft);}
  .step-bar li.current{color:var(--ink); font-weight:600; border-top-color:var(--ink);}
  .step-kicker{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:8px;}
  .topic-title{font-family:var(--serif); font-size:22px; font-weight:600; margin:2px 0 12px; line-height:1.4;}

  .field{
    width:100%; resize:vertical; min-height:76px; border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; font-family:inherit; font-size:14px; line-height:1.6; background:#fff; color:var(--ink);
  }
  .field:focus{outline:none; border-color:var(--ink);}
  .field-label{display:block; font-size:13px; font-weight:600; margin:14px 0 6px;}
  .recap{background:var(--paper-2); border-left:3px solid var(--ink); padding:10px 14px; margin-bottom:16px;}
  .recap p{margin:4px 0 0; font-size:14px; white-space:pre-wrap; color:var(--ink-soft);}

  .listen-bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px;}
  .listen-bar select{font-family:inherit; font-size:13px; border:1px solid var(--line); background:#fff; padding:6px 8px; border-radius:var(--radius); color:var(--ink);}
  .listen-note{font-size:11.5px; color:var(--ink-faint); flex-basis:100%;}
  .btn.small{padding:8px 14px; font-size:13px;}

  .reading h3{font-family:var(--serif); font-size:17px; font-weight:600; margin:22px 0 8px;}
  .reading p{font-size:15px; margin:0 0 10px; line-height:1.85;}
  .reading ul{margin:0 0 10px; padding-left:20px; font-size:15px; line-height:1.85;}
  .reading .story{background:var(--paper-2); border:1px solid var(--line); padding:16px 18px; margin-bottom:6px;}
  .reading .story p:last-child{margin-bottom:0;}
  .reading .point{border-left:3px solid var(--ink); padding:4px 0 4px 14px; margin:18px 0 6px;}
  .reading .point p{margin:0; font-weight:500;}
  .reading .ba{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 12px;}
  .reading .ba div{border:1px solid var(--line); padding:10px 12px; font-size:13.5px; line-height:1.6;}
  .reading .ba b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:4px;}
  .reading .ba .after{border-color:var(--ink);}
  .reading .flow{list-style:none; padding:0; margin:6px 0 12px;}
  .reading .flow li{display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:14px;}
  .reading .flow li span:first-child{flex:0 0 92px; font-weight:600;}
  .reading .fiction{font-size:11.5px; color:var(--ink-faint); margin-top:8px;}
  @media (max-width:480px){ .reading .ba{grid-template-columns:1fr;} .reading .flow li{flex-direction:column; gap:2px;} .reading .flow li span:first-child{flex:none;} }

  .timer-row{display:flex; align-items:center; gap:14px; margin:14px 0;}
  .timer{font-family:var(--mono); font-size:28px; font-weight:500; font-variant-numeric:tabular-nums;}
  .reread{border:1px solid var(--line); background:#fff; padding:4px 16px 12px; margin:14px 0;}
  .reread summary{cursor:pointer; font-size:13.5px; font-weight:600; padding:10px 0;}

  .recall-card{border:1px solid var(--line); background:#fff; padding:14px 16px; margin-bottom:10px;}
  .recall-word{font-family:var(--serif); font-size:17px; font-weight:600; margin-bottom:8px;}
  .recall-def{font-size:14px; background:var(--paper-2); padding:10px 12px; margin-bottom:10px; line-height:1.7;}
  .link-btn{background:none; border:none; padding:0; font-size:13px; color:var(--ink-soft); text-decoration:underline; cursor:pointer;}
  .link-btn:hover{color:var(--ink);}
  .rate-row{display:flex; flex-wrap:wrap; gap:8px;}
  .rate-result{font-size:13px; font-weight:600;}
  .rate-result.ng{font-weight:400; color:var(--ink-soft);}

  .review-banner{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--ink); color:var(--paper); border:none; border-radius:var(--radius);
    padding:14px 16px; margin-bottom:20px; cursor:pointer; font-family:inherit;
  }
  .review-banner .count{font-family:var(--serif); font-size:28px; font-weight:600; line-height:1;}
  .review-banner .txt{flex:1; font-size:13px; line-height:1.6;}
  .review-banner .txt strong{display:block; font-size:15px;}
  .review-banner .go{font-size:13px; font-weight:600; white-space:nowrap;}
  .review-banner.idle{background:var(--paper-2); color:var(--ink-soft); border:1px solid var(--line); cursor:default;}
  .review-banner.idle strong{color:var(--ink);}
  .review-card{text-align:center; padding:26px 18px;}
  .review-card .recall-word{font-size:22px; margin:8px 0 12px;}
  .review-card .recall-def{text-align:left;}
  .countdown{font-family:var(--serif); font-size:48px; font-weight:600; margin:6px 0 14px; font-variant-numeric:tabular-nums;}
  .review-card .rate-row{justify-content:center;}

  /* --- 質問ボット --- */
  .bot-fab{
    position:fixed; right:20px; bottom:20px; z-index:50;
    display:flex; align-items:center; gap:8px;
    background:var(--ink); color:var(--paper); border:none; border-radius:24px;
    padding:12px 18px; font-size:14px; font-weight:500; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
  }
  .bot-fab:hover{background:#000;}
  .bot-fab svg{width:18px; height:18px;}
  .in-chat .bot-fab{display:none;}
  .bot-panel{
    position:fixed; right:20px; bottom:76px; z-index:51;
    width:360px; max-width:calc(100vw - 32px); height:500px; max-height:calc(100vh - 110px);
    background:#fff; border:1px solid var(--ink); border-radius:var(--radius);
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    display:flex; flex-direction:column; overflow:hidden;
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .18s ease, transform .18s ease;
  }
  .bot-panel.open{opacity:1; pointer-events:auto; transform:translateY(0);}
  .bot-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line);}
  .bot-head b{font-family:var(--serif); font-size:15px; font-weight:600;}
  .bot-head span{display:block; font-size:11px; color:var(--ink-faint);}
  .bot-close{background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--ink); padding:2px 6px;}
  .bot-msgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--paper-2);}
  .bot-empty{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .bot-empty .chip{display:block; width:100%; margin-top:8px; font-size:12.5px;}
  .bot-msg{max-width:88%; padding:9px 12px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; border-radius:var(--radius);}
  .bot-msg.user{align-self:flex-end; background:var(--ink); color:var(--paper);}
  .bot-msg.bot{align-self:flex-start; background:#fff; border:1px solid var(--line);}
  .bot-msg.pending{color:var(--ink-faint);}
  .bot-msg.error{border-style:dashed;}
  .bot-input{display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:#fff;}
  .bot-input textarea{
    flex:1; resize:none; border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 10px; font-family:inherit; font-size:13.5px; min-height:40px; max-height:96px;
  }
  .bot-input textarea:focus{outline:none; border-color:var(--ink);}
  .bot-input .btn{padding:8px 14px; font-size:13px; align-self:flex-end;}
  @media (max-width:480px){
    .bot-fab{right:14px; bottom:14px;}
    .bot-panel{right:16px; bottom:66px;}
    main{padding-bottom:90px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">UI/UX</span><h1>設計思考ラボ</h1></div>
    <p class="tagline">基礎知識・クイズ・対話・疑似実践の4つの方法で、UI/UXの原則を「知っている」から「使える」に変えます。</p>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-mode="basics">基礎知識</button>
      <button class="tab" data-mode="quiz">クイズ式</button>
      <button class="tab" data-mode="socratic">ソクラテス式</button>
      <button class="tab" data-mode="practice">疑似実践</button>
    </nav>
  </header>
  <main id="main"></main>
  <footer class="app-footer"><div class="corner corner-bl"></div><div class="corner corner-br"></div></footer>
</div>

<button class="bot-fab" id="bot-fab" aria-label="質問ボットを開く">
  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5m-8 6 2.5-3H19a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h0z"/></svg>
  質問する
</button>
<div class="bot-panel" id="bot-panel" role="dialog" aria-label="質問ボット">
  <div class="bot-head">

const BASICS_STEPS = ["予想する","読む","説明する","用語を思い出す","クイズ"];
const REVIEW_KEY = "uiux-review-cards";
const NOTES_KEY = "uiux-basics-notes";
const STATS_KEY = "uiux-lab-stats";

const DAY = 24*60*60*1000;

/* ============ STATE ============ */
let mode = "basics";

let quiz = {i:0, score:0, selected:-1};

let explainTimer = null, reviewTimer = null;

/* localStorage はプライベートモード等で使えないことがあるので、失敗しても学習は続けられるようにする */
const store = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
};
const pad2 = n => String(n).padStart(2,"0");
const NET_ERROR = "通信エラーが発生しました。もう一度送信してみてください。";

// 4択の選択肢。selected が -1 なら未回答
function choicesHTML(item, selected){
  const answered = selected >= 0;
  return item.c.map((c,n)=>{
    const cls = !answered ? "" : n === item.a ? " correct" : n === selected ? " wrong" : "";
    return `<button class="choice${cls}" data-act="choose" data-idx="${n}" ${answered?"disabled":""}><span class="mark">${String.fromCharCode(65+n)}</span><span>${c}</span></button>`;
  }).join("");
}

// 「思い出せた／思い出せなかった」の自己評価ボタン
function rateRowHTML(act, attrs, ngLabel, hidden){
  return `
    <div class="rate-row" ${hidden?"hidden":""}>
      <button class="btn small" data-act="${act}" ${attrs} data-ok="1">思い出せた</button>
      <button class="btn small secondary" data-act="${act}" ${attrs} data-ok="0">${ngLabel}</button>
    </div>`;
}

function loadStats(){ stats = Object.assign(stats, store.get(STATS_KEY, {})); }
function saveStats(){ store.set(STATS_KEY, stats); }

/* ============ CLAUDE CALL（サーバー側の関数に中継してもらう。APIキーはブラウザに出さない） ============ */
async function askMentor(kind, history){
  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({mode:kind, messages:history})
  });
  let data = null;
  try{ data = await res.json(); }catch(e){ /* 本文が JSON でない場合 */ }
  if(!res.ok || !data || data.error || typeof data.text !== "string") throw new Error((data && data.error) || NET_ERROR);
  return data.text;
}

/* ============ RENDER: TABS ============ */
document.getElementById("tabs").addEventListener("click", e=>{
  const btn = e.target.closest(".tab");
  if(!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t===btn));
  render();
  window.scrollTo(0,0);
});

function stopMedia(){
  if(explainTimer){ clearInterval(explainTimer); explainTimer = null; }
  if(reviewTimer){ clearInterval(reviewTimer); reviewTimer = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

function render(){
  stopMedia();
  const main = document.getElementById("main");
  if(mode === "basics") main.innerHTML = basicsHTML();
  else if(mode === "quiz") main.innerHTML = quizHTML();
  else if(mode === "socratic") main.innerHTML = socratic.topic ? chatHTML("socratic") : socraticHomeHTML();
  else main.innerHTML = practice.scenario ? chatHTML("practice") : practiceHomeHTML();
  // AIとの対話画面では、右下の質問ボタンが送信ボタンに重ならないように隠す
  document.body.classList.toggle("in-chat", (mode==="socratic" && !!socratic.topic) || (mode==="practice" && !!practice.scenario));
  renderDueBadge();
  if(mode === "basics") afterBasicsRender();
  else if(mode === "socratic" || mode === "practice"){
    scrollThreadToBottom();
    const input = document.getElementById("chat-input");
    if(input) input.focus();
  }
}

/* ============ BASICS（思い出す学び方） ============
   星友啓『スタンフォード大学・オンラインハイスクール校長が教える 脳が一生忘れないインプット術』の
   「思い出す（リトリーバル）」中心の学び方で進める。
   各トピック: 前回の振り返り → 予想する（前リトリーバル） → 読む（見る＋聞く／記憶のためのメモ）
              → 説明する（後リトリーバル） → 用語を思い出す（ワード・リトリーバル） → クイズ
   思い出した用語は復習カードとして保存し、間をあけて「今日の復習」で思い出す。 */

function getNotes(index){ return store.get(NOTES_KEY, {})[index] || {}; }
function saveNote(index, field, value){
  const all = store.get(NOTES_KEY, {});
  all[index] = Object.assign({}, all[index], {[field]:value});
  store.set(NOTES_KEY, all);
}

function go(view, index){
  basics.view = view;
  if(index != null) basics.index = index;
  basics.checked = false;
  basics.selected = -1;
  render();
  window.scrollTo(0,0);
}

// トピックの入口。2つ目以降は、まず前回の内容を思い出してから進む
function enterTopic(index){
  if(index >= BASICS.length) return go("result", index);
  go(index === 0 ? "predict" : "warm", index);
}

function stepBar(step){
  const t = BASICS[basics.index];
  return `
    <div class="quiz-meta"><span>TOPIC ${pad2(basics.index+1)} / ${pad2(BASICS.length)}</span><span>${t.title}</span></div>
    <ol class="step-bar">${BASICS_STEPS.map((s,i)=>`<li class="${i<step?'done':i===step?'current':''}">${s}</li>`).join("")}</ol>`;
}

function recallCardHTML(k, id, withRating){
  return `
    <div class="recall-card" id="${id}">
      <div class="recall-word">${k.word}</div>
      <div class="recall-def" hidden>${k.def}</div>
      <button class="link-btn" data-act="reveal" data-id="${id}">思い出したら、答えを見る</button>
      ${withRating ? rateRowHTML("rate", `data-id="${id}"`, "忘れていた", true) : ""}
    </div>`;
}

        <p>本文を書き写すのではなく、次の3つを書きましょう。<strong>できれば紙のノートに手書き</strong>がおすすめです。ここに書いた内容は、この端末に保存されます。</p>
        <label class="field-label">① キーワードの意味を、自分の言葉で</label>
        <textarea class="field" data-note="words" placeholder="例：シグニファイア＝「ここ押せるよ」と教えてくれる目じるし">${escapeHTML(notes.words || "")}</textarea>
        <label class="field-label">② 自分の考え（賛成・反対、その理由、ほかとのつながり）</label>
        <textarea class="field" data-note="thoughts" placeholder="例：いつも使っているアプリでも、カートは右上にある。だから…">${escapeHTML(notes.thoughts || "")}</textarea>
        <label class="field-label">③ 疑問（わからないこと、もっと知りたいこと）</label>
        <textarea class="field" data-note="questions" placeholder="例：パソコンの画面でも、フィッツの法則は同じように考えるの？">${escapeHTML(notes.questions || "")}</textarea>

      </div>
      <div class="actions"><button class="btn" data-act="explain">読み終えた → 何も見ずに説明する</button></div>`;
  }

  if(v === "explain") return `
    ${stepBar(2)}
    <div class="step-kicker">STEP 3　後リトリーバル</div>
    <h2 class="panel-title">本文は閉じました。目を閉じて、いま読んだ内容を心の中で説明してみましょう</h2>
    <p class="lede">友だちに教えるつもりで、30秒。<strong style="color:var(--ink)">まめ日和で湊さんが何をしたか</strong>も入れて説明できると、記憶に残りやすくなります。思い出せないところがあっても大丈夫。思い出そうとすること自体が記憶を強くします。</p>
    <div class="timer-row">
      <button class="btn small secondary" id="timer-btn" data-act="timer">30秒タイマーをスタート</button>
      <span class="timer" id="timer">0:30</span>
    </div>
    <textarea class="field" data-note="explain" placeholder="説明した内容を書き出してもOK（任意）">${escapeHTML(notes.explain || "")}</textarea>
    ${basics.checked ? `
    <div id="explain-check" style="margin-top:22px;">
      <div class="explain"><b>答え合わせ</b>本文と照らし合わせましょう。説明できなかったところが、まだ覚えていないところです。そこを重点的に読み直してください。</div>
      <details class="reread" open><summary>本文を開く</summary><div class="reading">${t.content}</div></details>
      <h3 class="panel-title" style="font-size:17px;">説明してみて、どうでしたか？</h3>
      <div class="actions">
        <button class="btn" data-act="words">だいたい説明できた → 用語を思い出す</button>
        <button class="btn secondary" data-act="explain">あまりできなかった → もう一度説明する</button>
      </div>
    </div>` : `<div class="actions" style="margin-top:16px;"><button class="btn" data-act="check-explain">答え合わせをする</button></div>`}`;

  if(v === "words") return `
    ${stepBar(3)}
    <div class="step-kicker">STEP 4　ワード・リトリーバル</div>
    <h2 class="panel-title">キーワードの意味を、答えを見ずに思い出しましょう</h2>
    <p class="lede">頭の中で言えたら答えを見て、思い出せたかどうかを正直に選んでください。選んだ用語は復習カードになり、日をあけて「今日の復習」に出てきます。</p>
    ${t.keywords.map((k,n)=>recallCardHTML(k, `word-${i}-${n}`, true)).join("")}
    <div class="actions" style="margin-top:8px;"><button class="btn" data-act="quiz">確認クイズへ</button></div>`;

  if(v === "quiz"){
    const q = t.question, answered = basics.selected >= 0;
    const isLast = i + 1 >= BASICS.length;
    return `
      ${stepBar(4)}
      <div class="step-kicker">STEP 5　場面で使えるか確かめる</div>
      <div class="quiz-card">
        <p class="quiz-q">${q.q}</p>
        ${choicesHTML(q, basics.selected)}
        ${answered ? `<div class="explain"><b>${basics.selected === q.a ? "正解" : "不正解"}　解説</b>${q.e}</div>
        <div class="quiz-footer"><button class="btn" data-act="next-topic">${isLast ? "結果を見る" : "次のトピックへ"}</button></div>` : ""}
      </div>`;
  }

  if(v === "result"){
    const all = store.get(NOTES_KEY, {});
    const qs = BASICS.map((b,n)=>({title:b.title, n, q:((all[n] && all[n].questions) || "").trim()})).filter(x=>x.q);
    const total = BASICS.reduce((n,b)=>n+b.keywords.length, 0);
    return `
      <div class="quiz-done">
        <div class="eyebrow">RESULT</div>
        <p class="lede" style="margin-bottom:0;">まめ日和のストーリーはここまでです</p>
        <div class="score">${basics.score}<span style="font-size:20px;color:var(--ink-faint);"> / ${BASICS.length}</span></div>
      </div>
      <div class="block block-ink">
        <div class="step-kicker">次にやること</div>
        <p>${total}個の用語が復習カードになりました。<strong>明日、この「基礎知識」タブの「今日の復習」</strong>から思い出しましょう。忘れかけたころに思い出すほど、記憶は長持ちします。</p>
        <p>学んだ原則は、クイズ式・ソクラテス式・疑似実践でさらに使ってみましょう。</p>
      </div>
      ${qs.length ? `
      <div class="block">
        <h3>あなたが書いた疑問</h3>
        ${qs.map(x=>`<div class="recall-card"><div class="step-kicker">${x.title}</div><p style="white-space:pre-wrap;">${escapeHTML(x.q)}</p><button class="btn small secondary" data-act="ask-q" data-n="${x.n}">質問ボットに聞く</button></div>`).join("")}

      </div>` : ""}
      <div class="actions"><button class="btn" data-act="home">基礎知識のトップに戻る</button></div>`;
  }

  if(v === "review"){
    const q = basics.reviewQueue;
    if(basics.reviewPos >= q.length) return `
      <div class="quiz-done">
        <div class="eyebrow">REVIEW</div>
        <h2 class="panel-title">おつかれさまでした</h2>
        <p class="lede">今日の復習は完了です。思い出せた用語は、次はもっと間をあけて出てきます。</p>
        <button class="btn" data-act="home">基礎知識のトップに戻る</button>
      </div>`;
    const c = q[basics.reviewPos], shown = basics.reviewShown;
    return `
      <div class="quiz-meta"><span>今日の復習</span><span>${basics.reviewPos+1} / ${q.length}</span></div>
      <div class="block review-card">
        <div class="step-kicker">5秒リトリーバル</div>
        <div class="recall-word">${c.word}</div>
        ${shown ? `
          <div class="recall-def">${c.def}</div>
          ${rateRowHTML("review-rate", "", "思い出せなかった", false)}` : `
          <p class="lede" style="margin:0;">この用語の意味を、頭の中で言ってみましょう</p>
          <div class="countdown" id="countdown">5</div>
          <button class="link-btn" data-act="review-reveal">答えを見る</button>`}
      </div>`;
  }
  return "";
}

function afterBasicsRender(){
  // 今日の復習：5秒たったら答えを出す
  if(basics.view === "review" && !basics.reviewShown && basics.reviewPos < basics.reviewQueue.length){
    let left = 5;
    reviewTimer = setInterval(()=>{
      left--;
      const cd = document.getElementById("countdown");
      if(!cd){ clearInterval(reviewTimer); reviewTimer = null; return; }
      if(left <= 0){ basics.reviewShown = true; render(); }
      else cd.textContent = left;
    }, 1000);
  }
}

function toggleListen(){
  const synth = window.speechSynthesis;
  const btn = document.getElementById("listen-btn");
  if(synth.speaking){
    synth.cancel();
    btn.textContent = "▶ 読み上げを聞きながら読む";
    return;
  }
  const u = new SpeechSynthesisUtterance(document.getElementById("reading").innerText);
  u.lang = "ja-JP";
  u.rate = parseFloat(document.getElementById("listen-rate").value) || 1;
  const voice = synth.getVoices().find(v=>v.lang && v.lang.startsWith("ja"));
  if(voice) u.voice = voice;
  u.onend = ()=>{ const b = document.getElementById("listen-btn"); if(b) b.textContent = "▶ 読み上げを聞きながら読む"; };
  synth.speak(u);
  btn.textContent = "■ 読み上げを止める";
}

function startExplainTimer(){
  if(explainTimer) clearInterval(explainTimer);
  let left = 30;
  const disp = document.getElementById("timer");
  document.getElementById("timer-btn").textContent = "もう一度30秒";
  disp.textContent = "0:30";
  explainTimer = setInterval(()=>{
    left--;
    disp.textContent = `0:${pad2(Math.max(left,0))}`;
    if(left <= 0){ clearInterval(explainTimer); explainTimer = null; disp.textContent = "終了"; }
  }, 1000);
}

// 復習カード。思い出せた回数（stage）に応じて次の復習日をのばし、思い出せなければ翌日に戻す
function addReviewCard(id, k, remembered){
  const cards = store.get(REVIEW_KEY, {});
  const prev = cards[id];
  const stage = remembered ? (prev ? Math.min(prev.stage + 1, REVIEW_INTERVALS.length - 1) : 0) : 0;
  cards[id] = {word:k.word, def:k.def, stage, due:Date.now() + REVIEW_INTERVALS[stage]*DAY};
  store.set(REVIEW_KEY, cards);
}

function dueReviewCards(){
  const cards = store.get(REVIEW_KEY, {}), now = Date.now();
  return Object.keys(cards).filter(id=>cards[id].due <= now).map(id=>Object.assign({id}, cards[id]));
}

function reviewBannerHTML(){
  const cards = store.get(REVIEW_KEY, {}), ids = Object.keys(cards);
  if(!ids.length) return "";
  const due = dueReviewCards();
  if(due.length) return `
    <button class="review-banner" data-act="review-start">
      <span class="count">${due.length}</span>
      <span class="txt"><strong>今日の復習</strong>前に学んだ用語を、1語5秒で思い出しましょう</span>
      <span class="go">はじめる →</span>
    </button>`;
  const d = new Date(Math.min(...ids.map(id=>cards[id].due)));
  return `<div class="review-banner idle"><span class="txt"><strong>今日の復習はありません</strong>次の復習は ${d.getMonth()+1}月${d.getDate()}日です</span></div>`;
}

function renderDueBadge(){
  const tab = document.querySelector('.tab[data-mode="basics"]');
  const n = dueReviewCards().length;
  tab.innerHTML = `基礎知識${n ? `<span class="due" aria-label="今日の復習 ${n}語">${n}</span>` : ""}`;
}

/* ============ CHAT (shared by socratic & practice) ============ */
function chatHTML(kind){
  const st = kind === "socratic" ? socratic : practice;
  const title = kind === "socratic" ? SOCRATIC_TOPICS.find(t=>t.id===st.topic).label : PRACTICE_SCENARIOS.find(s=>s.id===st.scenario).title;
  const msgs = st.messages.map(m=>{
    const who = m.role === "user" ? "あなた" : (kind==="socratic"?"メンター":"シニアデザイナー");
    const cls = m.role === "user" ? "user" : ("mentor" + (m.summary?" summary":""));
    const bubbleCls = m.error ? "bubble error" : "bubble";
    return `<div class="msg ${cls}"><div class="who">${who}</div><div class="${bubbleCls}">${escapeHTML(m.text)}</div></div>`;
  }).join("");
  const typing = st.busy ? `<div class="msg mentor"><div class="who">${kind==="socratic"?"メンター":"シニアデザイナー"}</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div></div>` : "";
  const doneState = kind==="socratic" && socratic.done;
  return `
    <button class="back-link" data-act="back">← テーマ一覧に戻る</button>
    <div class="eyebrow">${kind==="socratic"?"SOCRATIC MODE":"PRACTICE MODE"}</div>
    <h2 class="panel-title">${title}</h2>
    <div class="chat-thread" id="thread">${msgs}${typing}</div>
    ${doneState ? `<button class="btn secondary" data-act="back">別のテーマを試す</button>` :
    `<div class="composer">
      <textarea id="chat-input" placeholder="考えを書いてみてください…" ${st.busy?"disabled":""}></textarea>
      <button class="btn" data-act="send" ${st.busy?"disabled":""}>送る</button>
    </div>`}`;
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function scrollThreadToBottom(){
  const t = document.getElementById("thread");
  if(t) t.scrollTop = t.scrollHeight;
  window.scrollTo({top: document.body.scrollHeight, behavior: "instant"});
}

/* ============ 操作（すべてのモードのクリックを data-act で受ける） ============ */
const ACTIONS = {
  // 基礎知識
  start(){ basics.score = 0; enterTopic(0); },
  predict(){ go("predict"); },
  read(){ go("read"); },
  explain(){ go("explain"); },
  words(){ go("words"); },
  quiz(){ go("quiz"); },
  home(){ go("intro"); },
  listen: toggleListen,
  timer: startExplainTimer,
  "check-explain"(){
    basics.checked = true;
    render();
    document.getElementById("explain-check").scrollIntoView({behavior:"smooth", block:"start"});
  },
  reveal(el){
    const card = document.getElementById(el.dataset.id);
    card.querySelector(".recall-def").hidden = false;
    el.hidden = true;
    const rate = card.querySelector(".rate-row");
    if(rate) rate.hidden = false;
  },
  rate(el){
    const [, index, n] = el.dataset.id.split("-").map(Number);
    const ok = el.dataset.ok === "1";
    addReviewCard(`${index}-${n}`, BASICS[index].keywords[n], ok);
    el.parentElement.innerHTML = `<span class="rate-result ${ok?"":"ng"}">${ok ? "✓ 思い出せた" : "もう一度読んで、覚え直そう"}</span>`;
  },
  "next-topic"(){ enterTopic(basics.index + 1); },
  "review-start"(){
    Object.assign(basics, {reviewQueue:dueReviewCards(), reviewPos:0, reviewShown:false});
    go("review");
  },
  "review-reveal"(){ basics.reviewShown = true; render(); },
  "review-rate"(el){
    const c = basics.reviewQueue[basics.reviewPos];
    addReviewCard(c.id, c, el.dataset.ok === "1");
    basics.reviewPos++;
    basics.reviewShown = false;
    render();
  },
  "ask-note"(){ openBot((getNotes(basics.index).questions || "").trim()); },
  "ask-q"(el){ openBot((getNotes(Number(el.dataset.n)).questions || "").trim()); },

  // 4択（基礎知識の確認クイズ・クイズ式で共通）
  choose(el){
    const st = mode === "quiz" ? quiz : basics;
    const item = mode === "quiz" ? QUIZ[quiz.i] : BASICS[basics.index].question;
    if(st.selected >= 0) return;
    st.selected = Number(el.dataset.idx);
    if(st.selected === item.a) st.score++;
    render();
  },

  // クイズ式
  "next-q"(){
    quiz.i++;
    quiz.selected = -1;
    if(quiz.i >= QUIZ.length && quiz.score > stats.quizBest){
      stats.quizBest = quiz.score;
      saveStats();
    }
    render();
  },
  restart(){ quiz = {i:0, score:0, selected:-1}; render(); },

  // ソクラテス式・疑似実践
  topic(el){
    const t = SOCRATIC_TOPICS.find(t=>t.id===el.dataset.id);
    socratic = {topic:t.id, messages:[{role:"assistant", text:t.opener}], busy:false, done:false};
    render();
  },
  scenario(el){
    const s = PRACTICE_SCENARIOS.find(s=>s.id===el.dataset.id);
    practice = {scenario:s.id, messages:[{role:"assistant", text:s.brief}], busy:false};
    render();
  },
  back(){
    if(mode === "socratic") socratic.topic = null; else practice.scenario = null;
    render();
  },
  send(){ sendChat(); }
};

const mainEl = document.getElementById("main");
mainEl.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
mainEl.addEventListener("keydown", e=>{
  if(e.target.id === "chat-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendChat(); }
});
// メモはその場でこの端末に保存する
mainEl.addEventListener("input", e=>{
  const field = e.target.dataset && e.target.dataset.note;
  if(mode === "basics" && field) saveNote(basics.index, field, e.target.value);
});

async function sendChat(){
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if(!text) return;
  const st = mode === "socratic" ? socratic : practice;
  st.messages.push({role:"user", text});
  st.busy = true;
  render();

  const kind = mode;
  const apiHistory = st.messages.filter(m=>!m.error).map(m=>({role: m.role === "user" ? "user" : "assistant", content: m.text}));

  try{
    const reply = await askMentor(kind, apiHistory);
    const isSummary = kind === "socratic" && reply.startsWith("まとめ：");
    st.messages.push({role:"assistant", text:reply, summary:isSummary});
    if(isSummary){
      socratic.done = true;
      if(!stats.topicsExplored.includes(socratic.topic)){
        stats.topicsExplored.push(socratic.topic);
        saveStats();
      }
    }
  }catch(err){
    st.messages.push({role:"assistant", text:err.message, error:true});
  }
  st.busy = false;
  if(mode === kind) render();
}

/* ============ 質問ボット ============ */
let botHistory = [];
let botBusy = false;
const botPanel = document.getElementById("bot-panel");
const botText = document.getElementById("bot-text");

function openBot(prefill){
  botPanel.classList.add("open");
  if(prefill) botText.value = prefill;
  setTimeout(()=>botText.focus(), 50);
}
document.getElementById("bot-fab").addEventListener("click", ()=>{
  if(botPanel.classList.contains("open")) botPanel.classList.remove("open");
  else openBot();
});
document.getElementById("bot-close").addEventListener("click", ()=>botPanel.classList.remove("open"));
document.getElementById("bot-send").addEventListener("click", ()=>sendBot());
botText.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendBot(); }
});
document.getElementById("bot-msgs").addEventListener("click", e=>{
  const chip = e.target.closest("[data-ask]");
  if(chip){ botText.value = chip.dataset.ask; sendBot(); }
});

function appendBot(cls, text){
  const box = document.getElementById("bot-msgs");
  const empty = box.querySelector(".bot-empty");
  if(empty) empty.remove();
  const div = document.createElement("div");
  div.className = "bot-msg " + cls;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function sendBot(){
  const text = botText.value.trim();
  if(!text || botBusy) return;
  botText.value = "";
  appendBot("user", text);
  botHistory.push({role:"user", content:text});
  botBusy = true;
  document.getElementById("bot-send").disabled = true;
  const pending = appendBot("bot pending", "考え中…");
  try{
    const answer = await askMentor("qa", botHistory);
    pending.textContent = answer;
    pending.className = "bot-msg bot";
    botHistory.push({role:"assistant", content:answer});
  }catch(err){
    pending.textContent = err.message;
    pending.className = "bot-msg bot error";
    botHistory.pop(); // 答えられなかった質問は履歴に残さない（次の送信で user が連続しないように）
  }
  botBusy = false;
  document.getElementById("bot-send").disabled = false;
  document.getElementById("bot-msgs").scrollTop = document.getElementById("bot-msgs").scrollHeight;
}

/* ============ INIT ============ */
loadStats();
render();
</script>
</body>
</html>
