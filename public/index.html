<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計思考ラボ — UI/UX学習アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#E9E2DA;
    --bg-2:#D9D5E6;
    --ink:#23223A;
    --ink-soft:#5E5C78;
    --ink-faint:#8D8BA5;
    --violet:#7C5CF0;
    --violet-2:#9B7FFF;
    --teal:#4FD1BC;
    --teal-2:#7BE3D2;
    --rose:#F6A8C8;
    --peach:#FFC9A8;
    --glass:rgba(255,255,255,.42);
    --glass-strong:rgba(255,255,255,.68);
    --glass-line:rgba(255,255,255,.75);
    --shadow:0 18px 40px -16px rgba(60,50,110,.28), 0 4px 12px -4px rgba(60,50,110,.12);
    --shadow-sm:0 8px 18px -8px rgba(60,50,110,.25);
    --sans:'Plus Jakarta Sans','Noto Sans JP',sans-serif;
    --jp:'Noto Sans JP','Plus Jakarta Sans',sans-serif;
    --r-lg:32px; --r-md:22px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--jp);
    font-size:16px; line-height:1.75;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:
      linear-gradient(115deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 38%),
      linear-gradient(160deg, var(--bg-1) 0%, #E4DBE3 45%, var(--bg-2) 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  /* 窓から差し込む光と影 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(40vw 40vw at 88% 6%, rgba(90,100,140,.28), transparent 70%),
      radial-gradient(34vw 34vw at 8% 92%, rgba(124,92,240,.18), transparent 70%),
      radial-gradient(30vw 30vw at 95% 85%, rgba(79,209,188,.22), transparent 70%),
      radial-gradient(26vw 26vw at 4% 8%, rgba(255,201,168,.40), transparent 70%);
  }
  .orb{position:fixed; border-radius:50%; filter:blur(50px); opacity:.55; pointer-events:none; z-index:0; animation:float 14s ease-in-out infinite;}
  .orb.o1{width:260px;height:260px;background:var(--violet-2);top:18%;left:-80px;}
  .orb.o2{width:220px;height:220px;background:var(--teal-2);bottom:8%;right:-60px;animation-delay:-5s;}
  .orb.o3{width:180px;height:180px;background:var(--rose);top:55%;left:55%;animation-delay:-9s;opacity:.35;}
  @keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-24px);}}

  ::selection{background:rgba(124,92,240,.25);}
  button{font-family:inherit;}

  .app{
    position:relative; z-index:1;
    max-width:720px; margin:28px auto;
    padding:32px 36px 36px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(150%);
    backdrop-filter:blur(26px) saturate(150%);
    border:1px solid var(--glass-line);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.3);
    min-height:calc(100vh - 56px);
  }

  .app-header{padding:0;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-icon{
    width:48px; height:48px; flex:none; border-radius:16px;
    display:grid; place-items:center; color:#fff;
    background:linear-gradient(140deg,var(--teal) 0%,var(--violet) 100%);
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .brand-icon svg{width:26px;height:26px;}
  .app-header h1{
    font-family:var(--jp); font-weight:700; font-size:24px; margin:0; letter-spacing:.01em;
  }
  .brand-sub{font-family:var(--sans); font-size:12px; color:var(--ink-faint); letter-spacing:.08em; font-weight:600;}
  .tagline{font-size:14px; color:var(--ink-soft); margin:18px 2px 24px; max-width:48ch;}

  /* セグメントタブ */
  .tabs{
    display:flex; gap:4px; padding:5px;
    background:rgba(255,255,255,.35);
    border:1px solid var(--glass-line);
    border-radius:var(--r-pill);
    box-shadow:inset 0 2px 6px rgba(60,50,110,.08);
  }
  .tab{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:none; border:none; cursor:pointer;
    padding:12px 10px; border-radius:var(--r-pill);
    font-size:14px; font-weight:600; color:var(--ink-soft);
    transition:all .25s ease;
  }
  .tab svg{width:18px;height:18px;flex:none;}
  .tab:hover{color:var(--ink);}
  .tab.active{
    color:var(--ink);
    background:var(--glass-strong);
    box-shadow:var(--shadow-sm), inset 0 1px 0 #fff;
  }
  .tab.active svg{color:var(--violet);}
  button:focus-visible, textarea:focus-visible{outline:3px solid rgba(124,92,240,.45); outline-offset:2px;}

  main{padding:32px 0 8px; min-height:50vh;}

  /* --- shared --- */
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.1em;
    color:var(--violet);
    background:rgba(124,92,240,.1);
    padding:6px 12px; border-radius:var(--r-pill);
    margin-bottom:14px;
  }
  .panel-title{font-size:22px; font-weight:700; margin:0 0 12px; line-height:1.5;}
  .lede{color:var(--ink-soft); font-size:14.5px; margin:0 0 28px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:1px solid rgba(255,255,255,.5); cursor:pointer;
    padding:14px 28px; border-radius:var(--r-pill);
    font-size:14.5px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,var(--violet-2),var(--violet));
    box-shadow:0 12px 22px -10px rgba(124,92,240,.7), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 16px 26px -10px rgba(124,92,240,.75), inset 0 1px 0 rgba(255,255,255,.6);}
  .btn:active{transform:scale(.97);}
  .btn.secondary{
    color:#145C52;
    background:linear-gradient(135deg,rgba(123,227,210,.85),rgba(79,209,188,.7));
    box-shadow:0 12px 22px -12px rgba(40,150,130,.6), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}

  /* --- quiz --- */
  .quiz-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .quiz-count{
    font-family:var(--sans); font-size:13px; font-weight:700; color:var(--ink-soft);
    background:var(--glass-strong); padding:6px 14px; border-radius:var(--r-pill); box-shadow:var(--shadow-sm);
  }
  .quiz-progress{flex:1; max-width:220px; height:8px; border-radius:var(--r-pill); background:rgba(255,255,255,.55); overflow:hidden; box-shadow:inset 0 1px 3px rgba(60,50,110,.12);}
  .quiz-progress i{display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--teal),var(--violet)); transition:width .4s ease;}
  .quiz-card{
    background:var(--glass); border:1px solid var(--glass-line);
    border-radius:var(--r-lg); padding:28px 26px 26px;
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .quiz-q{font-size:18px; font-weight:700; margin:0 0 24px; line-height:1.7;}
  .choice{
    display:flex; align-items:center; gap:14px;
    width:100%; text-align:left; cursor:pointer;
    background:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.9);
    padding:14px 18px; margin-bottom:12px;
    border-radius:var(--r-md);
    font-size:14.5px; color:var(--ink); line-height:1.6;
    box-shadow:0 6px 14px -8px rgba(60,50,110,.22);
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .choice:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 12px 20px -10px rgba(124,92,240,.35); background:#fff;}
  .choice .mark{
    font-family:var(--sans); font-size:13px; font-weight:700; color:var(--violet);
    background:rgba(124,92,240,.12);
    width:32px; height:32px; flex:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .choice.correct{
    background:linear-gradient(135deg,rgba(123,227,210,.75),rgba(79,209,188,.55));
    border-color:rgba(255,255,255,.9); box-shadow:0 12px 22px -12px rgba(40,150,130,.6);
  }
  .choice.correct .mark{background:#fff; color:#12806F;}
  .choice.wrong{background:linear-gradient(135deg,rgba(246,168,200,.8),rgba(255,201,168,.7));}
  .choice.wrong .mark{background:#fff; color:#C0426E;}
  .choice:disabled{cursor:default;}
  .explain{
    margin-top:22px; padding:20px 22px;
    background:linear-gradient(135deg,rgba(255,201,168,.55),rgba(246,168,200,.45) 40%,rgba(155,127,255,.4) 100%);
    border:1px solid rgba(255,255,255,.85);
    border-radius:var(--r-md);
    font-size:14px; line-height:1.8;
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .explain b{font-family:var(--sans); font-size:12px; letter-spacing:.08em; display:block; margin-bottom:6px; color:var(--violet);}
  .quiz-footer{display:flex; justify-content:flex-end; margin-top:24px;}
  .quiz-done{text-align:center; padding:36px 10px;}
  .quiz-done .score{font-family:var(--sans); font-size:56px; font-weight:800; margin:16px 0; background:linear-gradient(135deg,var(--teal),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* --- socratic / practice --- */
  .topic-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .chip, .scenario-card{
    display:flex; align-items:center; gap:14px; text-align:left; cursor:pointer;
    background:var(--glass-strong);
    border:1px solid rgba(255,255,255,.9);
    border-radius:var(--r-md);
    padding:18px; color:var(--ink); font-size:14px; font-weight:600;
    box-shadow:var(--shadow-sm), inset 0 1px 0 #fff;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .chip:hover, .scenario-card:hover{transform:translateY(-3px); box-shadow:0 16px 26px -12px rgba(124,92,240,.4), inset 0 1px 0 #fff;}
  .ic{
    width:44px; height:44px; flex:none; border-radius:15px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(140deg,var(--violet-2),var(--violet));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .ic svg{width:22px;height:22px;}
  .ic.t{background:linear-gradient(140deg,var(--teal-2),var(--teal)); color:#0E5A4E;}
  .ic.r{background:linear-gradient(140deg,var(--peach),var(--rose)); color:#8C2E55;}
  .chip .done{margin-left:auto; color:#12A58C; font-family:var(--sans); font-size:12px; font-weight:700;}
  .scenario-list{display:flex; flex-direction:column; gap:14px;}
  .scenario-card{align-items:flex-start;}
  .scenario-card h3{margin:0 0 4px; font-size:15px; font-weight:700;}
  .scenario-card p{margin:0; font-size:13px; font-weight:400; color:var(--ink-soft); line-height:1.65;}

  .chat-thread{display:flex; flex-direction:column; gap:20px; margin-bottom:24px;}
  .msg{max-width:86%; animation:rise .25s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .msg.mentor{align-self:flex-start;}
  .msg.user{align-self:flex-end;}
  .msg .who{font-family:var(--sans); font-size:11px; font-weight:700; color:var(--ink-faint); margin:0 12px 6px; letter-spacing:.06em;}
  .msg.user .who{text-align:right;}
  .msg .bubble{padding:15px 20px; font-size:14.5px; line-height:1.8; border-radius:24px;}
  .msg.mentor .bubble{
    background:var(--glass-strong); border:1px solid rgba(255,255,255,.9);
    border-top-left-radius:8px; box-shadow:var(--shadow-sm), inset 0 1px 0 #fff;
  }
  .msg.user .bubble{
    color:#fff; border-top-right-radius:8px;
    background:linear-gradient(135deg,var(--violet-2),var(--violet));
    box-shadow:0 12px 22px -10px rgba(124,92,240,.6), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .msg.mentor.summary .bubble{
    background:linear-gradient(135deg,rgba(255,201,168,.6),rgba(246,168,200,.5) 45%,rgba(155,127,255,.45));
    white-space:pre-line;
  }
  .msg.mentor .bubble.error{background:rgba(246,168,200,.45);}
  .typing{display:inline-flex; gap:5px; padding:6px 0;}
  .typing span{width:7px; height:7px; border-radius:50%; background:var(--violet-2); animation:blink 1.1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .composer{
    display:flex; gap:10px; align-items:flex-end; position:sticky; bottom:12px;
    padding:8px 8px 8px 20px;
    background:var(--glass-strong);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.95); border-radius:28px;
    box-shadow:var(--shadow), inset 0 1px 0 #fff;
  }
  .composer textarea{
    flex:1; resize:none; border:none; background:transparent; outline:none;
    padding:10px 0; font-family:inherit; font-size:14.5px; color:var(--ink);
    min-height:44px; max-height:120px;
  }
  .composer textarea::placeholder{color:var(--ink-faint);}
  .composer textarea:focus-visible{outline:none;}
  .composer .btn{padding:12px 24px;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    background:var(--glass-strong); border:1px solid rgba(255,255,255,.9);
    color:var(--ink-soft); font-size:13px; font-weight:600;
    padding:8px 16px 8px 12px; margin-bottom:22px; border-radius:var(--r-pill);
    box-shadow:var(--shadow-sm);
  }
  .back-link svg{width:16px;height:16px;}
  .back-link:hover{color:var(--ink);}

  @media (max-width:560px){
    .app{margin:0; border-radius:0; padding:22px 16px 28px; min-height:100vh;}
    .app-header h1{font-size:20px;}
    .tab{font-size:12.5px; padding:11px 4px; gap:5px;}
    .tab svg{display:none;}
    .topic-grid{grid-template-columns:1fr;}
    .msg{max-width:94%;}
    .quiz-card{padding:22px 16px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  /* ===== GLASS v2: 厚みのあるガラス + 中性の背景 ===== */
  :root{
    --bg-1:#DDDAD5; --bg-2:#C9CBD0;
    --glass-rim:inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1.5px 0 rgba(255,255,255,.4), inset 1.5px 0 0 rgba(255,255,255,.55), inset -1.5px 0 0 rgba(255,255,255,.3), inset 0 0 22px rgba(255,255,255,.35);
    --cast:0 22px 26px -14px rgba(35,35,55,.38), 0 6px 10px -4px rgba(35,35,55,.14);
    --cast-sm:0 12px 14px -8px rgba(35,35,55,.34), 0 3px 5px -2px rgba(35,35,55,.12);
    --pane:linear-gradient(145deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.22) 45%, rgba(255,255,255,.12) 62%, rgba(255,255,255,.4) 100%);
  }
  body{
    background:
      linear-gradient(118deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 34%),
      linear-gradient(160deg, #E3E0DB 0%, #D6D4D1 50%, #C7C9CE 100%);
    background-attachment:fixed;
  }
  body::before{
    background:
      linear-gradient(112deg, transparent 52%, rgba(70,78,100,.20) 52.4%, rgba(70,78,100,.20) 70%, transparent 70.6%),
      linear-gradient(112deg, transparent 74%, rgba(70,78,100,.13) 74.4%, rgba(70,78,100,.13) 82%, transparent 82.6%),
      radial-gradient(42vw 42vw at 92% 4%, rgba(70,78,100,.24), transparent 70%),
      radial-gradient(30vw 30vw at 5% 95%, rgba(255,255,255,.55), transparent 70%);
  }
  /* 背景の“ガラスの向こう側”に見える中性の形 */
  .orb{filter:blur(34px); opacity:.55; animation:float 18s ease-in-out infinite;}
  .orb.o1{background:rgba(255,255,255,.9); width:300px; height:300px;}
  .orb.o2{background:#9A9DA8; width:240px; height:240px; opacity:.45;}
  .orb.o3{background:#F4F1EC; opacity:.7;}

  .app{
    background:var(--pane);
    -webkit-backdrop-filter:blur(30px) saturate(180%) brightness(1.04);
    backdrop-filter:blur(30px) saturate(180%) brightness(1.04);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:var(--glass-rim), 0 40px 60px -24px rgba(35,35,55,.4), 0 10px 18px -8px rgba(35,35,55,.16);
  }
  .app::before{ /* 斜めに走る反射 */
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 22%, rgba(255,255,255,0) 70%, rgba(255,255,255,.28) 100%);
  }
  .app > *{position:relative;}

  .brand-icon{
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 55%), linear-gradient(140deg, rgba(79,209,188,.9), rgba(124,92,240,.9));
    box-shadow:var(--cast-sm), inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(40,20,120,.25);
    border:1px solid rgba(255,255,255,.6);
  }

  .tabs{
    background:linear-gradient(180deg, rgba(60,60,80,.10), rgba(255,255,255,.25));
    border:1px solid rgba(255,255,255,.65);
    box-shadow:inset 0 3px 8px rgba(35,35,55,.16), inset 0 -1px 0 rgba(255,255,255,.8);
  }
  .tab.active{
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.62));
    border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--cast-sm), inset 0 1.5px 0 #fff, inset 0 -2px 5px rgba(35,35,55,.08);
  }

  .btn{
    border:1px solid rgba(255,255,255,.6);
    background:linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.06) 52%, rgba(255,255,255,0) 100%), linear-gradient(135deg, rgba(160,134,255,.92), rgba(104,72,232,.88));
    box-shadow:0 16px 18px -10px rgba(80,50,200,.6), 0 3px 4px rgba(35,35,55,.12), inset 0 1.5px 0 rgba(255,255,255,.85), inset 0 -3px 6px rgba(50,20,150,.3);
    text-shadow:0 1px 2px rgba(50,20,150,.35);
  }
  .btn:hover{box-shadow:0 20px 22px -10px rgba(80,50,200,.65), 0 3px 4px rgba(35,35,55,.12), inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -3px 6px rgba(50,20,150,.3);}
  .btn.secondary{
    color:#0F4F46; text-shadow:0 1px 0 rgba(255,255,255,.5);
    background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.08) 55%, rgba(255,255,255,0) 100%), linear-gradient(135deg, rgba(140,236,220,.9), rgba(70,200,180,.82));
    box-shadow:0 16px 18px -10px rgba(20,120,105,.5), 0 3px 4px rgba(35,35,55,.1), inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -3px 6px rgba(20,120,105,.22);
  }

  .quiz-count, .back-link{
    background:var(--pane); border:1px solid rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:var(--cast-sm), var(--glass-rim);
  }
  .quiz-progress{background:rgba(35,35,55,.1); box-shadow:inset 0 2px 4px rgba(35,35,55,.2), 0 1px 0 rgba(255,255,255,.8);}
  .quiz-progress i{box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}

  .quiz-card{
    background:var(--pane);
    -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:var(--cast), var(--glass-rim);
  }

  .choice, .chip, .scenario-card, .msg.mentor .bubble{
    background:linear-gradient(150deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.34) 50%, rgba(255,255,255,.5) 100%);
    -webkit-backdrop-filter:blur(16px) saturate(170%); backdrop-filter:blur(16px) saturate(170%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:var(--cast-sm), var(--glass-rim);
  }
  .choice:hover:not(:disabled), .chip:hover, .scenario-card:hover{
    background:linear-gradient(150deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.5) 50%, rgba(255,255,255,.7) 100%);
    box-shadow:0 18px 20px -10px rgba(35,35,55,.38), 0 4px 6px -2px rgba(35,35,55,.12), var(--glass-rim);
  }
  .choice .mark{
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(124,92,240,.14));
    box-shadow:inset 0 1px 0 #fff, 0 3px 6px -2px rgba(35,35,55,.25);

  /* ===== 実践ドリル ===== */
  .dr-card, .dr-opt, .dr-panel{

  }
  .dr-opt.correct, .dr-panel.correct{
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 55%), linear-gradient(135deg, rgba(140,236,220,.85), rgba(70,200,180,.65));
    box-shadow:0 16px 18px -10px rgba(20,120,105,.5), var(--glass-rim);
  }
  .dr-opt.wrong, .dr-panel.wrong{
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 55%), linear-gradient(135deg, rgba(246,168,200,.85), rgba(255,201,168,.7));
    box-shadow:0 16px 18px -10px rgba(190,70,110,.4), var(--glass-rim);
  }
  .dr-opt.correct .mark{background:#fff; color:#12806F;}

  .dr-panel.sel{box-shadow:0 0 0 3px rgba(124,92,240,.55), var(--cast-sm), var(--glass-rim);}
  .dr-opt:disabled, .dr-panel:disabled{cursor:default;}
  .dr-ab{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px;}
  .dr-panel{padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0;}

  .dr-sub{font-size:14px; font-weight:700; margin:0 0 14px;}

<script>
/* ============ DATA ============ */
const QUIZ = [
  {q:"ニールセンのユーザビリティ10原則のひとつ「システム状態の視認性」が指しているのは？",
   c:["システムが今何をしているかをユーザーに常に伝えること","システムのソースコードを公開すること","サーバーの稼働状況を管理者に通知すること","アプリのバージョン番号を画面に表示すること"], a:0,
   e:"ローディング表示や送信中の表示のように、今どんな状態かを伝えることで、待たされている不安や誤操作を防ぎます。"},
  {q:"「フィッツの法則」が説明しているのは？",
   c:["ターゲットが大きく、カーソルから近いほど到達時間が短くなる","選択肢が多いほど決定が速くなる","人は一度に7±2個の情報しか覚えられない","近くにある要素は関連していると認識される"], a:0,
   e:"よく使う操作（送信など）は大きく押しやすい位置に、誤操作を防ぎたい操作（削除など）はあえて小さく遠くに置くと有効です。"},
  {q:"「ヒックの法則」が示すのは？",
   c:["選択肢の数や複雑さが増えるほど、意思決定にかかる時間が長くなる","ボタンが大きいほどクリックしやすい","ユーザーは他サービスで慣れた操作方法を期待する","情報は近接性によってグループ化して認識される"], a:0,
   e:"メニュー項目を絞り込んだり、選択肢を段階的に見せる（プログレッシブディスクロージャー）ことで決定の負荷を下げられます。"},
  {q:"ゲシュタルトの「近接の法則」の説明として正しいのは？",
   c:["物理的に近くにある要素同士は関連していると認識される","似た形や色の要素は同じグループだと認識される","閉じていない図形も脳が補完して一つの形として認識する","動きが同じ要素はまとまりとして認識される"], a:0,
   e:"選択肢②は類似の法則、③は閉合の法則、④は共通運命の法則です。ラベルと入力欄の間隔を詰めるのは近接の法則の応用です。"},
  {q:"「ヤコブの法則」が教えてくれることは？",
   c:["ユーザーは他の多くのサイトで過ごした経験から使い方の期待を形成する","ユーザーは自分の好みに合わせてUIをカスタマイズしたがる","ユーザーは常に最新のデザイントレンドを求めている","ユーザーはテキストより画像を好む"], a:0,

let drill = {k:null, i:0, score:0, log:[], picked:null, rj:null, answered:false};
const drillMax = k => DRILL_SETS[k].qs.length * (k === "compare" ? 2 : 1);
function drillStart(k){ drill = {k, i:0, score:0, log:[], picked:null, rj:null, answered:false}; }

function drillHomeHTML(){
  const best = k => (stats.drill && stats.drill[k] != null) ? `最高スコア ${stats.drill[k]} / ${drillMax(k)}` : "未挑戦";
  const card = (k, tone, sub) => `
    <button class="dr-card" data-d="start" data-k="${k}">
      <span class="ic ${tone}">${ICONS.doc}</span>
      <span><h3>${DRILL_SETS[k].name}（${DRILL_SETS[k].qs.length}問）</h3><p>${DRILL_SETS[k].desc}</p><span class="meta">${sub} ・ ${best(k)}</span></span>
    </button>`;
  return `
    <div class="eyebrow">DRILL MODE</div>
    <h2 class="panel-title">画面を見て判断する実践ドリル</h2>
    <p class="lede">学んだ原則を、実際の画面づくりの判断に使う練習です。基礎編は選択式、比較編は2つの画面案から良い方を選び、理由まで答えます。</p>
    <div class="scenario-list">
      ${card("basic","","選択式 ・ 1問1点")}
      ${card("compare","t","A/B比較 + 理由 ・ 1問2点")}
    </div>`;
}

function drillHTML(){
  if(!drill.k) return drillHomeHTML();
  const set = DRILL_SETS[drill.k], n = set.qs.length;
  if(drill.i >= n) return drillResultHTML();
  const q = set.qs[drill.i];
  const head = `
    <button class="back-link" data-d="home">${ICONS.back}ドリル一覧へ</button>
    <div class="quiz-meta">
      <span class="quiz-count">${set.name} ${drill.i+1} / ${n}</span>
      <div class="quiz-progress"><i style="width:${Math.round(drill.i/n*100)}%"></i></div>
    </div>`;
  return head + (drill.k === "basic" ? drillMCHTML(q) : drillABHTML(q));
}
function drillNextBtn(){
  const last = drill.i === DRILL_SETS[drill.k].qs.length - 1;
  return `<div class="quiz-footer"><button class="btn" data-d="next">${last ? "結果を見る" : "次の問題へ"}</button></div>`;
}
function drillMCHTML(q){
  const K = ["A","B","C","D"];
  const opts = q.opts.map((o,j)=>{
    let c = "dr-opt";
    if(drill.answered){ if(j === q.ans) c += " correct"; else if(j === drill.picked) c += " wrong"; }
    return `<button class="${c}" data-d="mc" data-j="${j}" ${drill.answered?"disabled":""}><span class="mark">${K[j]}</span><span>${o}</span></button>`;
  }).join("");
  const ok = drill.picked === q.ans;
  return `<div class="quiz-card">
    <p class="quiz-q">${q.q}</p>${opts}
    ${drill.answered ? `<div class="explain"><b>${ok ? "正解" : "不正解"}</b>${q.why}</div>${drillNextBtn()}` : ""}
  </div>`;
}
function drillABHTML(q){
  const side = (s, html) => {
    let c = "dr-panel";
    if(drill.answered){ if(s === q.good) c += " correct"; else if(s === drill.picked) c += " wrong"; }
    else if(drill.picked === s) c += " sel";
    return `<button class="${c}" data-d="pick" data-s="${s}" ${drill.picked?"disabled":""}><span class="tag">案 ${s.toUpperCase()}</span><div class="mock">${html}</div></button>`;
  };
  let step2 = "";
  if(drill.picked){
    const K = ["ア","イ","ウ"];
    step2 = `<p class="dr-sub">そう考える理由として、もっとも適切なものを選んでください。</p>` +
      q.reasons.map((r,j)=>{
        let c = "dr-opt";
        if(drill.answered){ if(j === q.r) c += " correct"; else if(j === drill.rj) c += " wrong"; }
        return `<button class="${c}" data-d="reason" data-j="${j}" ${drill.answered?"disabled":""}><span class="mark">${K[j]}</span><span>${r}</span></button>`;
      }).join("");
  }
  let fb = "";
  if(drill.answered){
    const okP = drill.picked === q.good, okR = drill.rj === q.r, pt = (okP?1:0) + (okR?1:0);
    const head = okP && okR ? "正解" : okP ? "選択は正解、理由が違います" : okR ? "理由は合っていますが、選んだ案が逆です" : "不正解";
    fb = `<div class="explain"><b>${head}（${pt} / 2点）</b>良い案は <strong>案 ${q.good.toUpperCase()}</strong> です。${q.why}</div>${drillNextBtn()}`;
  }
  return `<div class="quiz-card">
    <p class="dr-scn">${q.scn}</p>
    <p class="quiz-q">より良いのはどちらですか。</p>
    <div class="dr-ab">${side("a", q.a)}${side("b", q.b)}</div>
    ${step2}${fb}
  </div>`;
}
function drillResultHTML(){
  const m = drillMax(drill.k), pct = Math.round(drill.score / m * 100);
  const msg = pct === 100 ? "満点です。判断の根拠まで身についています。" : pct >= 70 ? "よくできています。間違えた問題の解説を読み返してみてください。" : "まだ伸びしろがあります。解説を読んでから、もう一度挑戦してみましょう。";
  return `<div class="quiz-done">
    <div class="eyebrow">RESULT</div>
    <p class="lede" style="margin-bottom:0;">${DRILL_SETS[drill.k].name} が終わりました</p>
    <div class="score">${drill.score}<span style="font-size:20px;color:var(--ink-faint);"> / ${m}</span></div>
    <p class="lede">${msg}</p>
    <ul class="dr-review">${drill.log.map((l,j)=>`<li><span class="pt">${l.pt}/${l.max}</span><span>${j+1}. ${l.t.length>46 ? l.t.slice(0,46)+"…" : l.t}</span></li>`).join("")}</ul>
    <div class="btn-row" style="justify-content:center;"><button class="btn secondary" data-d="again">もう一度</button><button class="btn" data-d="home">ドリル一覧へ</button></div>
  </div>`;
}
document.getElementById("main").addEventListener("click", e=>{
  if(mode !== "drill") return;
  const t = e.target.closest("[data-d]");
  if(!t) return;
  const act = t.dataset.d;
  const q = drill.k ? DRILL_SETS[drill.k].qs[drill.i] : null;
  const top = ()=>window.scrollTo({top:0, behavior:"instant"});
  if(act === "start"){ drillStart(t.dataset.k); render(); top(); }
  else if(act === "home"){ drill.k = null; render(); top(); }
  else if(act === "again"){ drillStart(drill.k); render(); top(); }
  else if(act === "mc" && !drill.answered){
    drill.picked = Number(t.dataset.j); drill.answered = true;
    const ok = drill.picked === q.ans;
    if(ok) drill.score++;
    drill.log.push({t:q.q, pt:ok?1:0, max:1});
    render();
  }
  else if(act === "pick" && !drill.picked){ drill.picked = t.dataset.s; render(); }
  else if(act === "reason" && !drill.answered){
    drill.rj = Number(t.dataset.j); drill.answered = true;
    const pt = (drill.picked === q.good ? 1 : 0) + (drill.rj === q.r ? 1 : 0);
    drill.score += pt;
    drill.log.push({t:q.scn, pt, max:2});
    render();
  }
  else if(act === "next"){
    drill.i++; drill.picked = null; drill.rj = null; drill.answered = false;
    if(drill.i >= DRILL_SETS[drill.k].qs.length){
      stats.drill = stats.drill || {};
      if(stats.drill[drill.k] == null || drill.score > stats.drill[drill.k]) stats.drill[drill.k] = drill.score;
      saveStats();
    }
    render(); top();
  }
});

let mode = "quiz";

let socratic = {topic:null, messages:[], busy:false, done:false};
let practice = {scenario:null, messages:[], busy:false};
let stats = {quizBest:0, quizPlays:0, topicsExplored:[], recall:{}};
let recall = {card:null, phase:"home", text:"", ticks:[]};

/* best-effort persistence */
async function loadStats(){
  try{
    let v = null;
    if(window.storage){ const r = await window.storage.get("uiux-lab-stats", false); v = r && r.value; }
    else v = localStorage.getItem("uiux-lab-stats");
    if(v) stats = Object.assign(stats, JSON.parse(v));
    if(!stats.recall) stats.recall = {};
  }catch(e){ /* no persisted stats yet, or storage unavailable */ }
}
async function saveStats(){
  try{
    if(window.storage) await window.storage.set("uiux-lab-stats", JSON.stringify(stats), false);
    else localStorage.setItem("uiux-lab-stats", JSON.stringify(stats));
  }catch(e){}
}

/* ============ CLAUDE CALL ============ */
async function askMentor(kind, history){
  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({mode:kind, messages:history})
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok || !data || data.error || typeof data.text !== "string") throw new Error((data && data.error) || "network error");
  return data.text;
}

  else if(mode === "recall") main.innerHTML = recallHTML();
  else if(mode === "drill") main.innerHTML = drillHTML();
  else main.innerHTML = practice.scenario ? chatHTML("practice") : practiceHomeHTML();
  attachHandlers();
  if(mode !== "drill") scrollThreadToBottom();
}

/* ============ QUIZ ============ */
function quizHTML(){
  if(quiz.i >= QUIZ.length){
    const pct = Math.round((quiz.score/QUIZ.length)*100);
    return `
      <div class="quiz-done">
        <div class="eyebrow">RESULT</div>
        <p class="lede" style="margin-bottom:0;">全${QUIZ.length}問が終わりました</p>
        <div class="score">${quiz.score}<span style="font-size:20px;color:var(--ink-faint);"> / ${QUIZ.length}</span></div>
        <p class="lede">正答率 ${pct}%${stats.quizBest ? ` ・ 自己ベスト ${stats.quizBest}問` : ""}</p>
        <button class="btn" id="restart">もう一度挑戦する</button>
      </div>`;
  }
  const qi = quiz.order[quiz.i];
  const item = QUIZ[qi];
  const choices = item.c.map((c,idx)=>{
    let cls = "choice";
    if(quiz.answered){
      if(idx === item.a) cls += " correct";
      else if(idx === quiz.selected) cls += " wrong";
    }
    return `<button class="${cls}" data-idx="${idx}" ${quiz.answered?"disabled":""}>
      <span class="mark">${String.fromCharCode(65+idx)}</span><span>${c}</span>
    </button>`;
  }).join("");
  return `
    <div class="quiz-meta">
      <span class="quiz-count">Q ${quiz.i+1} / ${QUIZ.length}</span>
      <div class="quiz-progress"><i style="width:${Math.round((quiz.i/QUIZ.length)*100)}%"></i></div>
    </div>
    <div class="quiz-card">
      <p class="quiz-q">${item.q}</p>
      ${choices}
      ${quiz.answered ? `<div class="explain"><b>解説</b>${item.e}</div>
        <div class="quiz-footer"><button class="btn" id="next-q">${quiz.i===QUIZ.length-1?"結果を見る":"次の問題へ"}</button></div>` : ""}
    </div>`;
}

const ICONS = {
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>'
};
const CHIP_TONES = ["","t","r","","t","r"];
/* ============ SOCRATIC ============ */
function socraticHomeHTML(){
  const chips = SOCRATIC_TOPICS.map((t,i)=>`<button class="chip" data-topic="${t.id}"><span class="ic ${CHIP_TONES[i%6]}">${ICONS.spark}</span><span>${t.label}</span>${stats.topicsExplored.includes(t.id)?'<span class="done">完了</span>':""}</button>`).join("");
  return `
    <div class="eyebrow">SOCRATIC MODE</div>
    <h2 class="panel-title">対話しながら、自分の言葉で原則にたどり着く</h2>
    <p class="lede">答えは教えません。質問に答えていくうちに、原則そのものを自分で導き出せるように設計されています。まずはテーマを選んでください。</p>
    <div class="topic-grid">${chips}</div>`;
}

/* ============ PRACTICE ============ */
function practiceHomeHTML(){
  const cards = PRACTICE_SCENARIOS.map((s,i)=>`
    <div class="scenario-card" data-scenario="${s.id}">
      <span class="ic ${CHIP_TONES[(i+1)%6]}">${ICONS.doc}</span>
      <div><h3>${s.title}</h3><p>${s.brief.slice(0,42)}…</p></div>
    </div>`).join("");
  return `
    <div class="eyebrow">PRACTICE MODE</div>
    <h2 class="panel-title">実務シナリオで判断力を鍛える</h2>
    <p class="lede">現場でよくある状況をシミュレーションします。あなたの提案に対して、シニアデザイナー役からレビューが返ってきます。</p>
    <div class="scenario-list">${cards}</div>`;
}

/* ============ CHAT (shared by socratic & practice) ============ */
function chatHTML(kind){
  const st = kind === "socratic" ? socratic : practice;
  const title = kind === "socratic" ? SOCRATIC_TOPICS.find(t=>t.id===st.topic).label : PRACTICE_SCENARIOS.find(s=>s.id===st.scenario).title;
  const msgs = st.messages.map(m=>{
    const who = m.role === "user" ? "あなた" : (kind==="socratic"?"メンター":"シニアデザイナー");
    const cls = m.role === "user" ? "user" : ("mentor" + (m.summary?" summary":""));
    const bubbleCls = m.error ? "bubble error" : "bubble";
    return `<div class="msg ${cls}"><div class="who">${who}</div><div class="${bubbleCls}">${escapeHTML(m.text)}</div></div>`;
  }).join("");
  const typing = st.busy ? `<div class="msg mentor"><div class="who">${kind==="socratic"?"メンター":"シニアデザイナー"}</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div></div>` : "";
  const doneState = kind==="socratic" && socratic.done;
  return `
    <button class="back-link" id="back-home">${ICONS.back}テーマ一覧に戻る</button>
    <div class="eyebrow">${kind==="socratic"?"SOCRATIC MODE":"PRACTICE MODE"}</div>
    <h2 class="panel-title">${title}</h2>
    <div class="chat-thread" id="thread">${msgs}${typing}</div>
    ${doneState ? `<button class="btn secondary" id="another-topic">別のテーマを試す</button>` :
    `<div class="composer">
      <textarea id="chat-input" placeholder="考えを書いてみてください…" ${st.busy?"disabled":""}></textarea>
      <button class="btn" id="chat-send" ${st.busy?"disabled":""}>送る</button>
    </div>`}`;
}

/* ============ RECALL ============ */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(str,n){ const [y,m,d]=str.split("-").map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
function daysUntil(str){ const [y,m,d]=str.split("-").map(Number); const [y2,m2,d2]=todayStr().split("-").map(Number); return Math.round((new Date(y,m-1,d)-new Date(y2,m2-1,d2))/86400000); }
function recallBadge(id){
  const r = stats.recall[id];
  if(!r) return '<span class="badge">はじめて</span>';
  const n = daysUntil(r.due);
  if(n<=0) return '<span class="badge due">今日、思い出す</span>';
  return '<span class="badge ok">あと'+n+'日</span>';
}
function flowHTML(phase){
  const st = [["read","① 読む"],["write","② 隠して思い出す"],["check","③ 答え合わせ"],["plan","④ 日をあけて再挑戦"]];
  const idx = {study:0, write:1, check:2, done:3}[phase];
  return '<div class="flow">'+st.map((x,i)=>'<span class="s'+(i===idx?' on':'')+'">'+x[1]+'</span>').join('<i>›</i>')+'</div>';
}
function recallHTML(){
  const ph = recall.phase;
  if(ph==="home"){
    const due = RECALL_CARDS.filter(c=>stats.recall[c.id] && daysUntil(stats.recall[c.id].due)<=0);
    const rest = RECALL_CARDS.filter(c=>!due.includes(c));
    const row = c=>`<button class="chip" data-recall="${c.id}"><span class="ic ${CHIP_TONES[RECALL_CARDS.indexOf(c)%6]}">${ICONS.spark}</span><span>${c.title}</span>${recallBadge(c.id)}</button>`;
    return `
      <div class="eyebrow">RECALL MODE</div>
      <h2 class="panel-title">読み返すより、思い出す</h2>
      <p class="lede">覚えるいちばん確かな方法は、見ないで思い出そうとすることです。思い出せなかった部分こそ、記憶が強くなる場所です。読む → 隠す → 書き出す → 答え合わせ、の順で進めます。</p>
      ${due.length?`<div class="sec-label">今日、思い出すもの（${due.length}）</div><div class="topic-grid">${due.map(row).join("")}</div>`:""}
      <div class="sec-label">${due.length?"そのほか":"テーマを選ぶ"}</div>
      <div class="topic-grid">${rest.map(row).join("")}</div>`;
  }
  const c = RECALL_CARDS.find(x=>x.id===recall.card);
  const back = '<button class="back-link" id="recall-back">'+ICONS.back+'テーマ一覧に戻る</button>';
  if(ph==="study"){
    return back + flowHTML("study") + `
      <div class="recall-card">
        <h3>${c.title}</h3>
        <p class="cue">${c.cue}</p>
        <ul class="points">${c.points.map((t,i)=>`<li><span class="dot">${i+1}</span><span>${t}</span></li>`).join("")}</ul>
      </div>
      <p class="hint">ひと通り読んだら、次の画面で隠します。丸暗記しなくて大丈夫です。</p>
      <div class="btn-row"><button class="btn" id="recall-hide">隠して思い出す</button></div>`;
  }
  if(ph==="write"){
    return back + flowHTML("write") + `
      <div class="recall-card">
        <h3>${c.title}</h3>
        <p class="cue">${c.cue}</p>
        <textarea class="recall-area" id="recall-text" placeholder="見ないで、覚えていることを自分の言葉で書き出してください。あいまいでも、途中でも大丈夫です。">${escapeHTML(recall.text)}</textarea>
        <p class="hint">思い出せない部分が出てきたら、ここが記憶を強くするチャンスです。少し粘ってから、答え合わせに進みましょう。</p>
      </div>
      <div class="btn-row"><button class="btn secondary" id="recall-peek">もう一度読む</button><button class="btn" id="recall-check">答え合わせをする</button></div>`;
  }
  if(ph==="check"){
    return back + flowHTML("check") + `
      <div class="recall-card">
        <h3>${c.title}</h3>
        <div class="sec-label" style="margin-top:6px;">あなたが書いたこと</div>
        <div class="mine">${recall.text.trim()?escapeHTML(recall.text):"（何も書かれていません）"}</div>
        <div class="sec-label" style="margin-top:6px;">書けていたものにチェックを入れてください</div>
        <ul class="points">${c.points.map((t,i)=>`<li><label><input type="checkbox" data-tick="${i}" ${recall.ticks[i]?"checked":""}><span>${t}</span></label></li>`).join("")}</ul>
      </div>
      <div class="btn-row"><button class="btn" id="recall-finish">結果を記録する</button></div>`;
  }
  /* done */
  const n = recall.ticks.filter(Boolean).length, tot = c.points.length;
  const r = stats.recall[c.id];
  const msg = n===tot ? "全部思い出せました。次は少し間をあけて、もう一度試します。"
    : n>0 ? "思い出せなかった部分が、次に強くなる部分です。"
    : "思い出せなくて大丈夫です。もう一度読んで、すぐ書き出し直してみましょう。";
  return back + flowHTML("done") + `
    <div class="recall-card" style="text-align:center;">
      <div class="eyebrow">RESULT</div>
      <div class="result-num">${n} / ${tot}</div>
      <p class="lede" style="margin-bottom:18px;">${msg}</p>
      <ul class="points" style="text-align:left;">${c.points.map((t,i)=>`<li class="${recall.ticks[i]?"hit":"miss"}"><span class="dot">${recall.ticks[i]?"○":"×"}</span><span>${t}</span></li>`).join("")}</ul>
      <p class="hint" style="margin-top:20px;">次に思い出す日：<b>${r?r.due.replace(/-/g,"/"):""}</b>（${r?daysUntil(r.due):0}日後）</p>
    </div>
    <div class="btn-row"><button class="btn secondary" id="recall-again">もう一度書き出す</button><button class="btn" id="recall-back2">テーマ一覧へ</button></div>`;
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function scrollThreadToBottom(){
  const t = document.getElementById("thread");
  if(t) t.scrollTop = t.scrollHeight;
  window.scrollTo({top: document.body.scrollHeight, behavior: "instant"});
}

/* ============ EVENT WIRING ============ */
function attachHandlers(){
  // quiz
  document.querySelectorAll(".choice").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(quiz.answered) return;
      quiz.answered = true;
      quiz.selected = Number(b.dataset.idx);
      const qi = quiz.order[quiz.i];
      if(quiz.selected === QUIZ[qi].a) quiz.score++;
      render();
    });
  });
  const nextQ = document.getElementById("next-q");
  if(nextQ) nextQ.addEventListener("click", ()=>{
    quiz.i++; quiz.answered=false; quiz.selected=-1;
    if(quiz.i >= QUIZ.length){
      stats.quizPlays++;
      if(quiz.score > stats.quizBest) stats.quizBest = quiz.score;
      saveStats();
    }
    render();
  });
  const restart = document.getElementById("restart");
  if(restart) restart.addEventListener("click", ()=>{
    quiz = {i:0, score:0, answered:false, selected:-1, order:[...Array(QUIZ.length).keys()]};
    render();
  });

  // socratic topic chips
  document.querySelectorAll(".chip[data-topic]").forEach(c=>{
    c.addEventListener("click", ()=>{
      const t = SOCRATIC_TOPICS.find(t=>t.id===c.dataset.topic);
      socratic = {topic:t.id, messages:[{role:"assistant", text:t.opener}], busy:false, done:false};
      render();
    });
  });

  // practice scenario cards
  document.querySelectorAll(".scenario-card").forEach(c=>{
    c.addEventListener("click", ()=>{
      const s = PRACTICE_SCENARIOS.find(s=>s.id===c.dataset.scenario);
      practice = {scenario:s.id, messages:[{role:"assistant", text:s.brief}], busy:false};
      render();
    });
  });

  // recall
  const setPhase = (ph)=>{ recall.phase = ph; render(); window.scrollTo({top:0, behavior:"instant"}); };
  document.querySelectorAll("[data-recall]").forEach(b=>b.addEventListener("click", ()=>{
    recall = {card:b.dataset.recall, phase:"study", text:"", ticks:[]}; setPhase("study");
  }));
  const rb = document.getElementById("recall-back");
  if(rb) rb.addEventListener("click", ()=>{ recall = {card:null, phase:"home", text:"", ticks:[]}; render(); });
  const rb2 = document.getElementById("recall-back2");
  if(rb2) rb2.addEventListener("click", ()=>{ recall = {card:null, phase:"home", text:"", ticks:[]}; render(); });
  const rh = document.getElementById("recall-hide");
  if(rh) rh.addEventListener("click", ()=>setPhase("write"));
  const rp = document.getElementById("recall-peek");
  if(rp) rp.addEventListener("click", ()=>{ recall.text = document.getElementById("recall-text").value; setPhase("study"); });
  const rt = document.getElementById("recall-text");
  if(rt){ rt.addEventListener("input", ()=>{ recall.text = rt.value; }); rt.focus(); }
  const rc = document.getElementById("recall-check");
  if(rc) rc.addEventListener("click", ()=>{ recall.text = document.getElementById("recall-text").value; recall.ticks = RECALL_CARDS.find(x=>x.id===recall.card).points.map(()=>false); setPhase("check"); });
  document.querySelectorAll("[data-tick]").forEach(cb=>cb.addEventListener("change", ()=>{ recall.ticks[Number(cb.dataset.tick)] = cb.checked; }));
  const rf = document.getElementById("recall-finish");
  if(rf) rf.addEventListener("click", ()=>{
    const c = RECALL_CARDS.find(x=>x.id===recall.card);
    const n = recall.ticks.filter(Boolean).length;
    const prev = stats.recall[c.id] || {box:-1};
    let box = n===c.points.length ? Math.min(prev.box+1, RECALL_STEPS.length-1) : n>0 ? Math.max(prev.box,0) : 0;
    if(box<0) box = 0;
    stats.recall[c.id] = {box, due:addDays(todayStr(), RECALL_STEPS[box]), last:todayStr()};
    saveStats(); setPhase("done");
  });
  const ra = document.getElementById("recall-again");
  if(ra) ra.addEventListener("click", ()=>{ recall.text=""; recall.ticks=[]; setPhase("write"); });

  // back to home
  const back = document.getElementById("back-home");
  if(back) back.addEventListener("click", ()=>{
    if(mode==="socratic") socratic.topic = null; else practice.scenario = null;
    render();
  });

  const another = document.getElementById("another-topic");
  if(another) another.addEventListener("click", ()=>{ socratic.topic = null; render(); });

  // chat send
  const sendBtn = document.getElementById("chat-send");
  const input = document.getElementById("chat-input");
  if(sendBtn && input){
    const send = ()=> sendChat();
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e=>{
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
    });
    input.focus();
  }
}

async function sendChat(){
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if(!text) return;
  const st = mode === "socratic" ? socratic : practice;
  st.messages.push({role:"user", text});
  st.busy = true;
  render();

    const apiHistory = st.messages.map(m=>({role: m.role === "user" ? "user" : "assistant", content: m.text}));

  try{
    const reply = await askMentor(mode, apiHistory);
    const isSummary = mode === "socratic" && reply.startsWith("まとめ：");
    st.messages.push({role:"assistant", text:reply, summary:isSummary});
    if(isSummary){
      socratic.done = true;
      if(!stats.topicsExplored.includes(socratic.topic)){
        stats.topicsExplored.push(socratic.topic);
        saveStats();
      }
    }
  }catch(err){
    st.messages.push({role:"assistant", text:"通信エラーが発生しました。もう一度送信してみてください。", error:true});
  }
  st.busy = false;
  render();
}

/* ============ INIT ============ */
(async function init(){
  await loadStats();
  render();
})();
</script>
</body>
</html>
